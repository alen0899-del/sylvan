        <style>
            /* Dark treatment for the opening Wavy Cubes interface only. */
            :root {
                --text-color: #ffffff;
                --secondary-text-color: #ffffff;
            }

            html,
            body {
                background: #000000;
                color: #ffffff;
            }

            .webgl {
                filter: invert(1) grayscale(1) contrast(1.28) brightness(.82);
            }

            .top-nav {
                background: rgba(0, 0, 0, .24);
            }

            .top-nav a,
            .nav-time {
                color: var(--secondary-text-color);
            }

            .top-nav .nav-logo a,
            .hero-section h1,
            .overlay a,
            .bar-location,
            .bar-projects a,
            .bar-availability a {
                color: var(--text-color);
            }

            .hero-section h1 .secondary {
                color: var(--secondary-text-color);
            }

            /* Keep the 3D grid dark while retaining the same wave motion. */
            .webgl {
                filter: none;
                background: #000000;
                transform: perspective(1100px) rotateX(45deg) scale(1.28);
                transform-origin: center center;
                opacity: .88;
                filter: saturate(.62) brightness(.78) contrast(1.04);
                backface-visibility: hidden;
                will-change: transform;
            }
        </style>
        <style>
            /* MagicOS 11-inspired glass interface: the 3D background stays untouched. */
            :root {
                --magic-glass: rgba(12, 20, 34, .68);
                --magic-glass-soft: rgba(21, 34, 54, .54);
                --magic-line: rgba(184, 222, 255, .2);
                --magic-line-strong: rgba(184, 222, 255, .34);
                --magic-blue: #a8d9ff;
            }

            .overlay {
                padding: 1.25rem;
            }

            .top-nav {
                top: 1.25rem;
                left: 1.25rem;
                width: calc(100% - 2.5rem);
                padding: .72rem .8rem;
                align-items: center;
                border: 1px solid var(--magic-line);
                border-radius: 24px;
                background: linear-gradient(135deg, rgba(27, 43, 67, .74), var(--magic-glass));
                box-shadow: 0 14px 38px rgba(0, 0, 0, .24), inset 0 1px 0 rgba(255, 255, 255, .08);
                -webkit-backdrop-filter: blur(24px) saturate(135%);
                backdrop-filter: blur(24px) saturate(135%);
            }

            .top-nav .nav-logo {
                padding-left: .35rem;
            }

            .top-nav .nav-logo a {
                color: #ffffff;
                text-shadow: 0 1px 14px rgba(168, 217, 255, .18);
            }

            .top-nav .nav-content {
                align-items: center;
                gap: .7rem;
            }

            .top-nav .nav-content .nav-links,
            .top-nav .nav-content .nav-socials {
                gap: .35rem;
            }

            .top-nav .animated-link {
                height: 1.35em;
                padding: 0 .72rem;
                border: 1px solid transparent;
                border-radius: 999px;
                background: rgba(255, 255, 255, .045);
                transition: background .3s ease, border-color .3s ease, box-shadow .3s ease;
            }

            .top-nav .link-content,
            .bottom-bar .link-content {
                transform: none;
            }

            .top-nav .link-text:nth-child(2),
            .bottom-bar .link-text:nth-child(2) {
                display: none;
            }

            .top-nav .animated-link:hover {
                border-color: var(--magic-line-strong);
                background: rgba(168, 217, 255, .13);
                box-shadow: 0 5px 18px rgba(93, 168, 255, .12);
            }

            .top-nav a,
            .nav-time,
            .nav-time p {
                color: rgba(239, 248, 255, .82);
                font-size: 15px;
            }

            .nav-time {
                display: flex;
                justify-content: flex-end;
                padding-right: .35rem;
            }

            .hero-section h1 {
                max-width: 47rem;
                padding: 0;
                border: 0;
                border-radius: 0;
                background: transparent;
                box-shadow: none;
                -webkit-backdrop-filter: none;
                backdrop-filter: none;
                color: #ffffff;
                line-height: 1.22;
                letter-spacing: -.02em;
                text-shadow: 0 2px 18px rgba(0, 0, 0, .42);
            }

            .hero-section h1 .secondary {
                display: block;
                margin-top: .45rem;
                color: rgba(214, 234, 255, .66);
            }

            .bottom-bar {
                align-items: center;
                gap: .6rem;
                padding: .65rem .8rem;
                border: 1px solid var(--magic-line);
                border-radius: 20px;
                background: linear-gradient(135deg, rgba(27, 43, 67, .62), rgba(9, 16, 28, .66));
                box-shadow: 0 12px 32px rgba(0, 0, 0, .2), inset 0 1px 0 rgba(255, 255, 255, .06);
                -webkit-backdrop-filter: blur(20px) saturate(125%);
                backdrop-filter: blur(20px) saturate(125%);
            }

            .bar-location p,
            .bar-projects a,
            .bar-availability a {
                color: rgba(239, 248, 255, .78);
                font-size: 13px;
            }

            .bottom-bar .animated-link {
                height: 1.35em;
                padding: 0 .6rem;
                border: 1px solid transparent;
                border-radius: 999px;
                transition: background .3s ease, border-color .3s ease, color .3s ease;
            }

            .bottom-bar .animated-link:hover {
                border-color: var(--magic-line-strong);
                background: rgba(168, 217, 255, .12);
                color: #ffffff;
            }

            .arrow-icon {
                filter: invert(1) brightness(1.4);
                opacity: .8;
            }

            @media (max-width: 768px) {
                .overlay {
                    padding: 1rem;
                }

                .top-nav {
                    top: 1rem;
                    left: 1rem;
                    width: calc(100% - 2rem);
                    padding: .72rem;
                    border-radius: 20px;
                }

                .top-nav .nav-logo {
                    padding-left: 0;
                }

                .top-nav .animated-link {
                    padding: 0 .52rem;
                }

                .hero-section h1 {
                    width: 100%;
                    line-height: 1.26;
                }

                .bottom-bar {
                    padding: .5rem;
                    border-radius: 16px;
                }
            }

            /* MagicOS 11 header refinement: two-line identity, one-line menu. */
            .top-nav {
                min-height: 190px;
                padding: 22px 26px;
                overflow: hidden;
                align-items: stretch;
                border-color: rgba(207, 232, 255, .24);
                background:
                    linear-gradient(115deg, rgba(174, 215, 255, .12), transparent 34%),
                    linear-gradient(180deg, rgba(18, 35, 58, .52), rgba(7, 17, 32, .36));
                box-shadow:
                    0 24px 60px rgba(0, 5, 18, .22),
                    inset 0 1px 0 rgba(255, 255, 255, .14),
                    inset 0 -1px 0 rgba(104, 177, 255, .08);
                -webkit-backdrop-filter: blur(34px) saturate(155%) brightness(1.08);
                backdrop-filter: blur(34px) saturate(155%) brightness(1.08);
            }

            .top-nav::before {
                content: "";
                position: absolute;
                inset: 0;
                pointer-events: none;
                background:
                    radial-gradient(70% 120% at 18% -30%, rgba(220, 240, 255, .13), transparent 56%),
                    linear-gradient(90deg, transparent 45%, rgba(143, 203, 255, .045) 72%, transparent);
                mix-blend-mode: screen;
            }

            .top-nav .nav-logo {
                position: relative;
                z-index: 1;
                width: 35%;
                min-width: 360px;
                padding: 0;
                display: flex;
                align-items: center;
            }

            .top-nav .nav-logo a {
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                gap: 2px;
                width: fit-content;
                line-height: .92;
                letter-spacing: -.055em;
            }

            .brand-name {
                display: block;
                font-size: clamp(4.2rem, 6.1vw, 6.8rem);
                font-weight: 100;
            }

            .brand-role {
                display: block;
                margin-top: .16em;
                font-size: clamp(2.2rem, 3.2vw, 3.7rem);
                font-weight: 650;
                letter-spacing: -.045em;
                color: rgba(239, 248, 255, .88);
            }

            .top-nav .nav-content {
                position: relative;
                z-index: 1;
                min-width: 0;
                display: grid;
                grid-template-columns: minmax(460px, 1fr) auto;
                align-self: stretch;
                align-items: flex-end;
                gap: 2rem;
                padding: 0 0 18px 1.4rem;
            }

            .top-nav .nav-content .nav-links {
                display: grid;
                grid-template-columns: repeat(3, minmax(138px, 164px));
                align-items: center;
                gap: 12px;
            }

            .top-nav .animated-link {
                min-width: 138px;
                height: 44px;
                padding: 10px 24px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                background: rgba(189, 222, 255, .055);
                border-color: rgba(220, 239, 255, .1);
                box-shadow: inset 0 1px 0 rgba(255, 255, 255, .055), 0 8px 24px rgba(0, 6, 22, .08);
            }

            .top-nav .animated-link:hover {
                border-color: rgba(211, 235, 255, .27);
                background: rgba(176, 215, 255, .14);
                box-shadow: 0 8px 24px rgba(64, 143, 255, .1), inset 0 1px 0 rgba(255, 255, 255, .1);
            }

            .top-nav .link-text {
                height: auto;
                justify-content: center;
                font-size: 17px;
                line-height: 24px;
                letter-spacing: .01em;
            }

            .top-nav .nav-time {
                justify-self: end;
                align-self: flex-end;
                padding: 0 0 11px;
                white-space: nowrap;
            }

            .top-nav .nav-time p {
                font-size: 17px;
                letter-spacing: .015em;
                color: rgba(235, 246, 255, .76);
            }

            .bottom-bar {
                min-height: 58px;
                padding: .78rem 1.15rem;
                text-decoration: none;
                pointer-events: all;
                cursor: pointer;
                transition: border-color .3s ease, background .3s ease, box-shadow .3s ease, transform .3s ease;
            }

            .bottom-bar:hover {
                border-color: rgba(211, 235, 255, .3);
                background: linear-gradient(115deg, rgba(54, 87, 126, .66), rgba(11, 24, 43, .7));
                box-shadow: 0 16px 42px rgba(0, 8, 26, .25), inset 0 1px 0 rgba(255, 255, 255, .11);
                transform: translateY(-1px);
            }

            .bottom-bar .bar-location {
                width: auto;
            }

            .bottom-bar .bar-availability {
                flex: 0 0 auto;
                margin-left: auto;
            }

            .bar-location p,
            .bar-contact-label {
                color: rgba(239, 248, 255, .86);
                font-size: 16px;
                line-height: 24px;
                letter-spacing: .01em;
            }

            .bar-contact-label {
                display: inline-flex;
                align-items: center;
                gap: 12px;
            }

            .bar-contact-label .arrow-icon {
                width: 22px;
                height: 22px;
                margin: 0;
                transition: transform .3s ease;
            }

            .bottom-bar:hover .bar-contact-label .arrow-icon {
                transform: translateX(4px);
            }

            @media (max-width: 1050px) {
                .top-nav { min-height: 172px; padding: 18px 20px; }
                .top-nav .nav-logo { min-width: 285px; width: 32%; }
                .top-nav .nav-content { grid-template-columns: 1fr; gap: .55rem; padding-left: .7rem; }
                .top-nav .nav-content .nav-links { grid-template-columns: repeat(3, minmax(108px, 1fr)); }
                .top-nav .nav-time { justify-self: start; padding: 0 .45rem; }
            }

            @media (max-width: 768px) {
                .top-nav { min-height: auto; align-items: flex-start; }
                .top-nav .nav-logo { min-width: 0; width: 100%; }
                .top-nav .nav-logo a { align-items: flex-start; }
                .brand-name { font-size: 2.7rem; }
                .brand-role { font-size: 1.55rem; }
                .top-nav .nav-content { display: block; padding: .8rem 0 0; align-self: auto; }
                .top-nav .nav-content .nav-links { grid-template-columns: repeat(3, 1fr); gap: 7px; }

                .bottom-bar { min-height: 52px; padding: .65rem .85rem; }

            }

            .copy-editor-toggle {
                position: fixed;
                right: 24px;
                bottom: 92px;
                z-index: 40;
                min-width: 112px;
                height: 44px;
                padding: 0 18px;
                border: 1px solid rgba(213, 237, 255, .22);
                border-radius: 999px;
                background: linear-gradient(135deg, rgba(80, 126, 181, .32), rgba(12, 27, 47, .6));
                color: rgba(245, 250, 255, .92);
                font: 500 15px/1 Inter, system-ui, sans-serif;
                letter-spacing: .02em;
                box-shadow: 0 14px 36px rgba(0, 8, 26, .3), inset 0 1px 0 rgba(255, 255, 255, .12);
                -webkit-backdrop-filter: blur(24px) saturate(150%);
                backdrop-filter: blur(24px) saturate(150%);
                cursor: pointer;
                transition: transform .25s ease, background .25s ease, border-color .25s ease;
            }

            .copy-editor-toggle:hover {
                transform: translateY(-2px);
                border-color: rgba(217, 239, 255, .38);
                background: linear-gradient(135deg, rgba(103, 157, 219, .42), rgba(17, 37, 63, .68));
            }

            .copy-editor {
                position: fixed;
                top: 22px;
                right: 22px;
                bottom: 22px;
                z-index: 50;
                width: min(410px, calc(100vw - 44px));
                padding: 22px;
                overflow: auto;
                border: 1px solid rgba(213, 237, 255, .23);
                border-radius: 28px;
                background:
                    radial-gradient(90% 50% at 10% 0%, rgba(165, 213, 255, .14), transparent 62%),
                    linear-gradient(160deg, rgba(25, 48, 78, .82), rgba(7, 18, 34, .88));
                box-shadow: -18px 24px 70px rgba(0, 5, 18, .42), inset 0 1px 0 rgba(255, 255, 255, .12);
                -webkit-backdrop-filter: blur(38px) saturate(155%);
                backdrop-filter: blur(38px) saturate(155%);
                color: #f4f9ff;
            }

            .copy-editor[hidden] { display: none; }

            .copy-editor-head {
                display: flex;
                align-items: flex-start;
                justify-content: space-between;
                gap: 16px;
                margin-bottom: 20px;
            }

            .copy-editor-head h2 {
                margin: 0;
                font-size: 22px;
                font-weight: 550;
                letter-spacing: -.02em;
            }

            .copy-editor-head p {
                margin: 6px 0 0;
                color: rgba(220, 236, 252, .58);
                font-size: 12px;
                line-height: 1.5;
            }

            .copy-editor-close {
                flex: 0 0 auto;
                width: 34px;
                height: 34px;
                border: 1px solid rgba(213, 237, 255, .14);
                border-radius: 50%;
                background: rgba(215, 237, 255, .06);
                color: #f4f9ff;
                font-size: 18px;
                cursor: pointer;
            }

            .copy-editor-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 13px;
            }

            .copy-editor-field {
                display: grid;
                gap: 7px;
            }

            .copy-editor-field.is-wide { grid-column: 1 / -1; }

            .copy-editor-field span {
                color: rgba(222, 238, 252, .66);
                font-size: 12px;
                letter-spacing: .035em;
            }

            .copy-editor input,
            .copy-editor textarea {
                width: 100%;
                border: 1px solid rgba(213, 237, 255, .13);
                border-radius: 14px;
                outline: none;
                background: rgba(215, 237, 255, .055);
                color: #f8fbff;
                font: 400 14px/1.5 Inter, system-ui, sans-serif;
                box-shadow: inset 0 1px 0 rgba(255, 255, 255, .035);
                transition: border-color .2s ease, background .2s ease, box-shadow .2s ease;
            }

            .copy-editor input { height: 43px; padding: 0 13px; }
            .copy-editor textarea { min-height: 88px; padding: 11px 13px; resize: vertical; }

            .copy-editor input:focus,
            .copy-editor textarea:focus {
                border-color: rgba(153, 208, 255, .42);
                background: rgba(180, 220, 255, .09);
                box-shadow: 0 0 0 3px rgba(91, 170, 255, .08), inset 0 1px 0 rgba(255, 255, 255, .06);
            }

            .copy-editor-actions {
                display: grid;
                grid-template-columns: 1fr 1.4fr;
                gap: 10px;
                margin-top: 18px;
            }

            .copy-editor-actions button {
                height: 44px;
                border: 1px solid rgba(213, 237, 255, .16);
                border-radius: 999px;
                background: rgba(213, 237, 255, .065);
                color: rgba(244, 249, 255, .86);
                font: 500 14px/1 Inter, system-ui, sans-serif;
                cursor: pointer;
            }

            .copy-editor-actions .is-primary {
                border-color: rgba(179, 221, 255, .28);
                background: linear-gradient(135deg, rgba(104, 170, 232, .48), rgba(64, 112, 179, .42));
                color: #fff;
            }

            .copy-editor-status {
                min-height: 18px;
                margin: 10px 4px 0;
                color: rgba(176, 220, 255, .72);
                font-size: 12px;
                text-align: center;
            }

            @media (max-width: 560px) {
                .copy-editor-toggle { right: 16px; bottom: 78px; }
                .copy-editor { inset: 10px; width: auto; padding: 18px; border-radius: 23px; }
                .copy-editor-grid { grid-template-columns: 1fr; }
                .copy-editor-field.is-wide { grid-column: auto; }
            }
        </style>
    </head>

        <canvas class="webgl"></canvas>
        <script>
            /* Opening-screen copy aligned with the Sylvan OS portfolio. */
            (() => {
                const setText = (selector, value) => {
                    document.querySelectorAll(selector).forEach((node) => {
                        const textNode = Array.from(node.childNodes).find((child) => child.nodeType === Node.TEXT_NODE);
                        if (textNode) textNode.nodeValue = value;
                    });
                };
                setText('.nav-links .animated-link:nth-child(1) .link-text', '个人介绍');
                setText('.nav-links .animated-link:nth-child(2) .link-text', '作品集');
                setText('.nav-links .animated-link:nth-child(3) .link-text', '关于我');
                const hero = document.querySelector('.hero-section h1');
                if (hero) {
                    hero.firstChild.nodeValue = '把复杂技术，变成自然体验。';
                    const secondary = hero.querySelector('.secondary');
                    if (secondary) secondary.textContent = '我是一名专注于 AI 交互、智能硬件与消费电子的产品经理。连接研究、设计与商业，把未来带进日常。';
                }
                setText('.bar-location p', 'Based in China');
            })();
        </script>
        <script>
            /* Portfolio copy for the alternate hero composition shown on this page. */
            (() => {
                const text = (selector, value) => {
                    document.querySelectorAll(selector).forEach((node) => {
                        const textNode = Array.from(node.childNodes).find((child) => child.nodeType === Node.TEXT_NODE);
                        if (textNode) textNode.nodeValue = value;
                        else node.textContent = value;
                    });
                };
                const title = document.querySelector('.hero-section h1');
                if (title) {
                    title.setAttribute('data-portfolio-title', '把复杂技术，变成自然体验。');
                    title.setAttribute('aria-label', '把复杂技术，变成自然体验。');
                }
                document.title = '严士然｜AI Product Manager';

                text('.nav-links .animated-link:nth-child(1) .link-text', '个人介绍');
                text('.nav-links .animated-link:nth-child(2) .link-text', '作品集');

        <script>
            /* This is the standalone entrance. All navigation hands off to
               the full portfolio in the same browser tab. */
            document.querySelectorAll('a[href^="./portfolio.html"]').forEach((link) => {
                link.removeAttribute('target');
            });
        </script>
        <script>
            (() => {
                const storageKey = 'ys-home-copy-v1';
                const defaults = {
                    name: '严士然',
                    role: '产品经理',
                    navProfile: '个人介绍',
                    navWork: '作品集',
                    navAbout: '关于我',
                    heroTitle: '把复杂技术，变成自然体验。',
                    heroDescription: '我是一名专注于 AI 交互、智能硬件与消费电子的产品经理。连接研究、设计与商业，把未来带进日常。',
                    location: 'Based in China',
                    contact: '保持联系'
                };
                const editor = document.getElementById('copyEditor');
                const toggle = document.getElementById('copyEditorToggle');
                const close = document.getElementById('copyEditorClose');
                const form = document.getElementById('copyEditorForm');
                const reset = document.getElementById('copyEditorReset');
                const status = document.getElementById('copyEditorStatus');

                const readStoredCopy = () => {
                    try {
                        const saved = JSON.parse(localStorage.getItem(storageKey) || '{}');
                        return { ...defaults, ...saved };
                    } catch {
                        return { ...defaults };
                    }
                };

                const setOwnText = (element, value) => {
                    if (!element) return;
                    let textNode = Array.from(element.childNodes).find((node) => node.nodeType === Node.TEXT_NODE);
                    if (!textNode) {
                        textNode = document.createTextNode('');
                        element.prepend(textNode);
                    }
                    textNode.nodeValue = value;
                };

                const applyCopy = (copy) => {
                    document.querySelector('.brand-name').textContent = copy.name;
                    document.querySelector('.brand-role').textContent = copy.role;
                    [copy.navProfile, copy.navWork, copy.navAbout].forEach((value, index) => {
                        document.querySelectorAll(`.nav-links .animated-link:nth-child(${index + 1}) .link-text`).forEach((node) => {
                            node.textContent = value;
                        });
                    });
                    const hero = document.querySelector('.hero-section h1');
                    setOwnText(hero, copy.heroTitle);
                    hero.setAttribute('aria-label', copy.heroTitle);
                    hero.querySelector('.secondary').textContent = copy.heroDescription;
                    document.querySelector('.bar-location p').textContent = copy.location;
                    setOwnText(document.querySelector('.bar-contact-label'), copy.contact);
                };

                const fillForm = (copy) => {
                    Object.entries(copy).forEach(([key, value]) => {
                        if (form.elements[key]) form.elements[key].value = value;
                    });
                };

                const openEditor = () => {
                    fillForm(readStoredCopy());
                    editor.hidden = false;
                    toggle.setAttribute('aria-expanded', 'true');
                    form.elements.name.focus();
                };

                const closeEditor = () => {
                    editor.hidden = true;
                    toggle.setAttribute('aria-expanded', 'false');
                    toggle.focus();
                };

                const savedCopy = readStoredCopy();
                applyCopy(savedCopy);
                fillForm(savedCopy);

                toggle.addEventListener('click', openEditor);
                close.addEventListener('click', closeEditor);
                document.addEventListener('keydown', (event) => {
                    if (event.key === 'Escape' && !editor.hidden) closeEditor();
                });

                form.addEventListener('submit', (event) => {
                    event.preventDefault();
                    const copy = Object.fromEntries(new FormData(form).entries());
                    applyCopy(copy);
                    try {
                        localStorage.setItem(storageKey, JSON.stringify(copy));
                        status.textContent = '已保存到当前浏览器';
                    } catch {
                        status.textContent = '已应用；当前浏览器不支持本地保存';
                    }
                });

                reset.addEventListener('click', () => {
                    try { localStorage.removeItem(storageKey); } catch {}
                    applyCopy(defaults);
                    fillForm(defaults);
                    status.textContent = '已恢复默认文字';
                });
            })();
        </script>
        <script src="./universal-compass.js?v=20260814"></script>
    </body>
